common: &default_settings
  license_key: ${NEW_RELIC_LICENSE_KEY}
  app_name: ${NEW_RELIC_APP_NAME:parking-lot-api}
  agent_enabled: ${NEW_RELIC_AGENT_ENABLED:true}
  application_logging:
    enabled: ${NEW_RELIC_APPLICATION_LOGGING_ENABLED:true}
    forwarding:
      enabled: ${NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED:true}
      max_samples_stored: ${NEW_RELIC_APPLICATION_LOGGING_FORWARDING_MAX_SAMPLES_STORED:10000}
    local_decorating:
      enabled: ${NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED:false}

development:
  <<: *default_settings

test:
  <<: *default_settings

staging:
  <<: *default_settings

production:
  <<: *default_settings
