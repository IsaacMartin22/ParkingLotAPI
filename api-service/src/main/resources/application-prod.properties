app.environment=prod

server.port=${PROD_SERVER_PORT:8081}

spring.datasource.url=${PROD_DATASOURCE_URL}
spring.datasource.username=${PROD_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${PROD_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate

management.metrics.tags.environment=prod

app.contact.to-email=${CONTACT_TO_EMAIL:IsaacMartin151@gmail.com}
app.contact.from-email=${CONTACT_FROM_EMAIL:no-reply@parkinglot.local}
app.contact.subject=${CONTACT_SUBJECT:Portfolio Contact Message}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
