spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/api-service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/portfolio}
spring.data.mongodb.auto-index-creation=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.address=0.0.0.0

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=api-service
management.metrics.tags.environment=${app.environment:local}

app.environment=local
spring.application.name=parking-lot-api
sumologic.http-source-url=${SUMOLOGIC_HTTP_SOURCE_URL:}

app.chat.openai-api-key=${OPENAI_API_KEY:}
app.chat.openai-embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
app.chat.openai-chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
app.chat.collection=${PORTFOLIO_CHAT_COLLECTION:portfolio_documents}
app.chat.vector-index=${PORTFOLIO_CHAT_VECTOR_INDEX:portfolio_documents_vector_index}
app.chat.max-context-chunks=${PORTFOLIO_CHAT_MAX_CONTEXT_CHUNKS:5}
app.chat.system-prompt=${PORTFOLIO_CHAT_SYSTEM_PROMPT:You are Isaac Martin's portfolio assistant. Answer recruiter and hiring manager questions using only the provided context. If the answer is not in the context, say you do not have enough information and invite them to ask about skills, experience, or projects.}
