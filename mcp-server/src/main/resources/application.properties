spring.application.name=parking-lot-mcp-server
server.address=${MCP_SERVER_ADDRESS:127.0.0.1}
server.port=${MCP_SERVER_PORT:8081}

# Read-only access to the API service's PostgreSQL database (same connection settings as api-service).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/api-service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Make pgjdbc enforce read-only even in auto-commit mode.
spring.datasource.hikari.data-source-properties.readOnlyMode=always
spring.sql.init.mode=never

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/portfolio}
app.chat.openai-api-key=${OPENAI_API_KEY:}
app.chat.openai-embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-large}
app.chat.collection=portfolio_documents
app.chat.vector-index=portfolio_documents_vector_index
app.chat.max-context-chunks=${PORTFOLIO_CHAT_MAX_CONTEXT_CHUNKS:5}
