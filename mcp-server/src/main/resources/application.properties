spring.application.name=parking-lot-mcp-server
server.address=${MCP_SERVER_ADDRESS:127.0.0.1}
server.port=${MCP_SERVER_PORT:8081}

# Read-only access to the API service's PostgreSQL database (same connection settings as api-service).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/api-service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=3
# Make pgjdbc enforce read-only even in auto-commit mode.
spring.datasource.hikari.data-source-properties.readOnlyMode=always
spring.sql.init.mode=never
