  - input: ":rocket: Optional Deploy to DigitalOcean"
    key: "optional-deploy-to-digitalocean"
    if: build.branch == "main"

  - label: ":droplet: Deploy Docker image to DigitalOcean"
    key: "deploy-docker-image-to-digitalocean"
    depends_on:
      - "publish-docker-image"
      - "optional-deploy-to-digitalocean"
    if: build.branch == "main"
    secrets:
      - "DOCKERHUB_USERNAME"
      - "DOCKERHUB_TOKEN"
      - "DO_DROPLET_HOST"
      - "DO_SSH_PRIVATE_KEY"
      - "DO_SSH_KNOWN_HOSTS"
    plugins:
      - docker#v5.12.0:
          image: "public.ecr.aws/docker/library/docker:27"
          mount-buildkite-agent: true
          environment:
            - DOCKERHUB_USERNAME
            - DOCKERHUB_TOKEN
            - DO_DROPLET_HOST
            - DO_SSH_USER
            - DO_SSH_PRIVATE_KEY
            - DO_SSH_KNOWN_HOSTS
            - DO_DEPLOY_PATH
            - DO_CONTAINER_NAME
            - DO_HOST_PORT
    command:
      - "chmod +x .buildkite/scripts/deploy-docker-image-to-digitalocean.sh"
      - "DOCKER_IMAGE_TAG=isaaccmartin151/parkinglotapi-app sh .buildkite/scripts/deploy-docker-image-to-digitalocean.sh"

  - label: ":white_check_mark: Verify DigitalOcean health"
    key: "verify-digitalocean-health"
    depends_on: "deploy-docker-image-to-digitalocean"
    if: build.branch == "main"
    plugins:
      - docker#v5.12.0:
          image: "curlimages/curl:8.12.1"
          entrypoint: ""
    command:
      - "curl --fail --show-error --silent --retry 30 --retry-all-errors --retry-delay 5 --retry-max-time 180 --connect-timeout 5 --max-time 10 http://159.203.113.71/api"

  - input: ":rocket: Optional Common Release"
    key: "optional-common-release"
  - label: ":package: Publish parking-lot-common to Maven Central"
    key: "publish-common-to-maven-central"
    depends_on: "optional-common-release"
    if: build.branch == "main"
    secrets:
      - "GITHUB_TOKEN"
      - "MAVEN_CENTRAL_USERNAME"
      - "MAVEN_CENTRAL_TOKEN"
      - "GPG_PRIVATE_KEY"
      - "GPG_PASSPHRASE"
    plugins:
      - docker#v5.12.0:
          image: "public.ecr.aws/docker/library/eclipse-temurin:17"
          mount-buildkite-agent: true
          environment:
            - GITHUB_TOKEN
            - MAVEN_CENTRAL_USERNAME
            - MAVEN_CENTRAL_TOKEN
            - GPG_PRIVATE_KEY
            - GPG_PASSPHRASE
    command:
      - "chmod +x ./mvnw"
      - "bash .buildkite/scripts/publish-common.sh"

  - input: ":rocket: Optional SDK Release"
    key: "optional-sdk-release"
    depends_on: "run-unit-tests"
    if: build.branch == "main"
    prompt: "Choose the semantic version bump for the SDK release tag."
    fields:
      - select: "SDK release type"
        key: "sdk_release_type"
        default: "patch"
        options:
          - label: "Patch"
            value: "patch"
          - label: "Minor"
            value: "minor"
          - label: "Major"
            value: "major"

  - label: ":label: Create SDK release tag"
    key: "create-sdk-release-tag"
    depends_on: "optional-sdk-release"
    if: build.branch == "main"
    secrets:
      - "GITHUB_TOKEN"
    plugins:
      - docker#v5.12.0:
          image: "public.ecr.aws/docker/library/eclipse-temurin:17"
          mount-buildkite-agent: true
          environment:
            - GITHUB_TOKEN
    command:
      - "chmod +x ./mvnw"
      - "bash .buildkite/scripts/release-sdk-tag.sh"

  - label: ":package: Publish SDK to Maven Central"
    key: "publish-sdk-to-maven-central"
    depends_on: "create-sdk-release-tag"
    if: build.branch == "main"
    secrets:
      - "GITHUB_TOKEN"
      - "MAVEN_CENTRAL_USERNAME"
      - "MAVEN_CENTRAL_TOKEN"
      - "GPG_PRIVATE_KEY"
      - "GPG_PASSPHRASE"
    plugins:
      - docker#v5.12.0:
          image: "public.ecr.aws/docker/library/eclipse-temurin:17"
          mount-buildkite-agent: true
          environment:
            - GITHUB_TOKEN
            - MAVEN_CENTRAL_USERNAME
            - MAVEN_CENTRAL_TOKEN
            - GPG_PRIVATE_KEY
            - GPG_PASSPHRASE
    command:
      - "chmod +x ./mvnw"
      - "bash .buildkite/scripts/publish-sdk.sh"
