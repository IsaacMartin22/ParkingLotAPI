steps:
  - label: ":pipeline: Run Unit Tests"
    key: "run-unit-tests"
    secrets:
      - "OPENAI_API_KEY"
    plugins:
      - docker#v5.12.0:
          image: "public.ecr.aws/docker/library/eclipse-temurin:17"
          environment:
            - OPENAI_API_KEY
    command:
      - "chmod +x ./mvnw"
      - "java -version"
      - "./mvnw -B -ntp test"

  - label: ":whale: Publish Docker image"
    key: "publish-docker-image"
    if: build.branch == "main"
    secrets:
      - "DOCKERHUB_USERNAME"
      - "DOCKERHUB_TOKEN"
    plugins:
      - docker#v5.12.0:
          image: "public.ecr.aws/docker/library/docker:27"
          mount-buildkite-agent: true
          environment:
            - DOCKERHUB_USERNAME
            - DOCKERHUB_TOKEN
            - DOCKER_IMAGE_TAG
          volumes:
            - "/var/run/docker.sock:/var/run/docker.sock"
    command:
      - "chmod +x .buildkite/scripts/publish-docker-image.sh"
      - "DOCKER_IMAGE_TAG=isaaccmartin151/parkinglotapi-app sh .buildkite/scripts/publish-docker-image.sh"

  - input: ":wastebasket: Optional MongoDB Wipe"
    key: "optional-mongodb-wipe"
    if: build.branch == "main"

  - label: ":wastebasket: Wipe portfolio_documents in MongoDB"
    key: "wipe-mongodb-portfolio-documents"
    depends_on: "optional-mongodb-wipe"
    if: build.branch == "main"
    secrets:
      - "MONGODB_URI"
    plugins:
      - docker#v5.12.0:
          image: "public.ecr.aws/docker/library/mongo:8"
          mount-buildkite-agent: true
          environment:
            - MONGODB_URI
            - MONGODB_DATABASE
            - MONGODB_COLLECTION
    command:
      - "chmod +x .buildkite/scripts/wipe-portfolio-documents.sh"
      - "MONGODB_DATABASE=portfolio MONGODB_COLLECTION=portfolio_documents sh .buildkite/scripts/wipe-portfolio-documents.sh"

